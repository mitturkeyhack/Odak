name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Derle
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Hataları göster
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|AAPT|Execution failed" build.log | head -10 | while IFS= read -r line; do
            echo "::error title=Derleme hatası::${line}"
          done

      - name: APK'yı hazırla
        run: cp app/build/outputs/apk/release/app-release.apk Odak.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Odak 1.0.${{ github.run_number }}
          body: |
            Odak – Instagram Reels engelleyici.
            İndir, kur, uygulamayı aç ve Erişilebilirlik iznini ver.
          files: Odak.apk
          make_latest: true
